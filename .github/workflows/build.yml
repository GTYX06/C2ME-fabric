name: C2ME Build Script

on:
  push: {}
  pull_request: {}

permissions:
  packages: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true

    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 26
        java-package: jdk

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        cache-cleanup: never

    - name: Build C2ME
      run: |
        ./gradlew clean build --stacktrace
      env:
        GPR_MAVEN_USER: ${{ github.actor }}
        GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: upload to modrinth and curseforge
      run: ./gradlew publishMods
      if: github.ref == 'refs/heads/dev/26.2.0'
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_UPLOAD_TOKEN }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        GITHUB_EVENT_RAW_PATH: ${{ github.event_path }}
        GPR_MAVEN_USER: ${{ github.actor }}
        GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: c2me-artifact
        path: 'build/libs/*.jar'
      
