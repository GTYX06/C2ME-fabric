name: C2ME Test

on:
  push: {}
  pull_request: {}

permissions:
  packages: read

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        testTask: [runTestC2MEServer, runProductionTestC2MEServer]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true

    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 26
        java-package: jdk

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        cache-cleanup: never
        
    - name: Test C2ME
      run: |
        ./gradlew clean ${{ matrix.testTask }}
      env:
        GPR_MAVEN_USER: ${{ github.actor }}
        GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
